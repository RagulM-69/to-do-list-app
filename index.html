<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
                <span class="toggle-icon">🌙</span>
            </button>
        </header>

        <main>
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Enter a new task..." 
                        autocomplete="off"
                    >
                    <button id="addTaskBtn" class="btn btn-primary">Add</button>
                </div>
            </div>

            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search tasks..." 
                    autocomplete="off"
                >
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="task-counter" id="taskCounter">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Pending: <strong id="pendingCount">0</strong></span>
                <span>Completed: <strong id="completedCount">0</strong></span>
            </div>

            <ul class="task-list" id="taskList">
                <!-- Tasks will be dynamically inserted here -->
            </ul>

            <div class="actions-section">
                <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
